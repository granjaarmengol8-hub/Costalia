dicions d'ús","Els càlculs són orientatius, depenen dels supòsits indicats i poden no reflectir preus, fiscalitat o condicions comercials reals. Contrasta les xifres amb fonts oficials i professionals abans de decidir."],["Propietat intel·lectual","El contingut propi de Costalia, la seva presentació i el seu codi estan subjectes a la normativa aplicable i als drets dels seus titulars."],["Responsabilitat i enllaços","No es garanteixen la precisió ni la disponibilitat ininterrompuda del servei. Els enllaços externs, quan n'hi hagi, tenen condicions pròpies."],["Normativa aplicable","Per a l'activitat dirigida des d'Espanya poden ser aplicables, entre d'altres, la Llei 34/2002 i la normativa de protecció de dades. Aquest text s'ha de revisar i completar amb les dades reals del responsable."]]},"en":{"title":"Legal notice","intro":"Information about the Costalia website.","parts":[["Website operator","TO BE COMPLETED BY THE OPERATOR: legal name, tax identifier, registered address, contact email and applicable company registration details. No operator details have been invented."],["Purpose","Costalia provides a free tool for estimating and comparing purchase, ownership and usage costs based on user-entered figures. It does not directly sell products or issue binding offers."],["Terms of use","Results are illustrative, depend on assumptions and may differ from real prices, tax rules and commercial conditions. Check numbers and terms with official and professional sources before acting."],["Intellectual property","Original Costalia content, presentation and code are subject to applicable laws and their respective owners' rights."],["Liability and links","Accuracy and uninterrupted availability are not guaranteed. External websites, if linked, have their own terms and privacy notices."],["Applicable law","For a service offered from Spain, Spanish Law 34/2002 and data protection rules may apply. The actual operator must review and complete this notice."]]}};const common={"
