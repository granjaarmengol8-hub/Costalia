<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0e3045"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>Política de privacidad | Costalia</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7faf7;color:#1b3b35;line-height:1.7}header{display:flex;align-items:center;justify-content:space-between;padding:17px max(20px,calc((100vw - 900px)/2));background:#fff;border-bottom:1px solid #e1e9e3;gap:12px}a{color:#276958;text-decoration:none}a:hover{text-decoration:underline}.logo{font-size:25px;font-weight:800;letter-spacing:-1px}.logo span{color:#4a9a7d}select{background:#f4f8f5;border:1px solid #d8e5dd;padding:9px;border-radius:9px;color:#234e40}main{max-width:900px;margin:35px auto;padding:0 20px 70px}h1{font-size:clamp(30px,4vw,47px);letter-spacing:-1.4px;margin:8px 0}.intro{color:#61766a;font-size:17px}.card{background:white;border:1px solid #e0e9e2;padding:25px 30px;border-radius:18px;margin-top:15px}h2{font-size:18px;margin-top:0}.card p{margin-bottom:0;color:#586f64}.warning{border:1px solid #ead9af;background:#fdf8e9;border-radius:12px;padding:13px 17px;color:#765f2c;font-size:14px}.back{display:inline-block;margin:26px 0 6px;font-weight:650}footer{border-top:1px solid #dfe8e0;padding-top:20px;margin-top:35px;display:flex;gap:14px;flex-wrap:wrap;font-size:13px}footer a{margin-right:12px}@media(max-width:600px){.card{padding:19px}}</style></head><body><header><a class="logo" href="/">costa<span>lia</span></a><select id="lang" aria-label="Idioma / Language"><option value="es">Español</option><option value="ca">Català</option><option value="en">English</option></select></header><main><a href="/" class="back" id="back"></a><h1 id="title"></h1><p class="intro" id="intro"></p><p class="warning" id="warning"></p><div id="sections"></div><footer><a id="legal" href="/aviso-legal.html">Aviso legal</a><a id="privacy" href="/privacidad.html">Privacidad</a><a href="/cookies.html">Cookies</a></footer></main><script>
const texts={"es":{"title":"Política de privacidad","intro":"Cómo funciona el tratamiento de datos en la versión actual de Costalia.","parts":[["Responsable","PENDIENTE DE COMPLETAR: identificación y datos de contacto del responsable del sitio web."],["Datos introducidos en la calculadora","Los importes y parámetros de la calculadora se procesan en el navegador del usuario mediante JavaScript. El código actual no envía esos valores a un servidor de Costalia. Al pulsar «Guardar simulación», los datos se guardan localmente en el navegador. La comprobación de presupuesto, si introduces ingresos o gastos fijos, se calcula también en tu navegador. Si compartes una simulación, los valores se incluyen en el enlace que tú decidas copiar y compartir; quien reciba el enlace podrá verlos."],["Datos técnicos del alojamiento","El proveedor de alojamiento puede tratar datos técnicos necesarios para servir el sitio, como direcciones IP o registros de acceso, según su infraestructura y políticas. Esto debe revisarse al configurar el despliegue real."],["Analítica, publicidad y formularios","El código actual no integra formularios de registro, analítica de terceros ni publicidad. La búsqueda opcional de productos envía el término buscado a un endpoint de Costalia que lo consulta mediante el proveedor SerpAPI para obtener ofertas. No introduzcas datos personales sensibles en el buscador. El servicio podría generar registros técnicos en el alojamiento y el proveedor de búsqueda. Si se incorporan en el futuro, esta política deberá actualizarse antes de activarlos."],["Derechos y contacto","Los usuarios pueden ejercer los derechos que reconozca la normativa aplicable dirigiéndose al responsable cuando sus datos de contacto se hayan publicado. No se debe presentar esta política como definitiva sin completar el responsable y verificar el alojamiento."],["Seguridad y conservación","Al pulsar «Guardar simulación», la aplicación conserva la simulación en el almacenamiento local (localStorage) de este navegador. Puedes borrarla desde «Mis simulaciones» o eliminando los datos del sitio en tu navegador. No se sincroniza con un servidor de Costalia. El tratamiento y conservación de registros técnicos por el alojamiento pueden depender de su configuración."]]},"ca":{"title":"Política de privacitat","intro":"Com es tracten les dades a la versió actual de Costalia.","parts":[["Responsable","PENDENT DE COMPLETAR: identificació i dades de contacte del responsable del lloc web."],["Dades de la calculadora","Els imports i paràmetres es processen al navegador mitjançant JavaScript. El codi actual no envia aquests valors a cap servidor de Costalia. Si prems «Desa simulació», les dades queden desades localment al navegador. El pressupost, si introdueixes ingressos o despeses fixes, també es calcula al navegador. Si comparteixes una simulació, els valors s'inclouen a l'enllaç que decideixis copiar i compartir; qui el rebi podrà veure'ls."],["Dades tècniques de l'allotjament","El proveïdor d'allotjament pot tractar dades tècniques necessàries per servir el web, com adreces IP o registres d'accés, segons la seva infraestructura i les seves polítiques. Cal verificar-ho en publicar."],["Analítica, publicitat i formularis","El codi actual no integra formularis de registre, analítica de tercers ni publicitat. La cerca opcional de productes envia el text cercat a un endpoint de Costalia, que consulta el proveïdor SerpAPI per obtenir ofertes. No introdueixis dades personals sensibles al cercador. El servei pot generar registres tècnics a l'allotjament i al proveïdor de cerca. Si s'hi incorporen, caldrà actualitzar aquesta política abans d'activar-los."],["Drets i contacte","Els usuaris poden exercir els drets que reconegui la normativa aplicable davant el responsable quan se'n publiquin les dades de contacte. No s'ha de donar aquesta política per definitiva sense completar-les."],["Seguretat i conservació","Quan prems «Desa simulació», l'aplicació guarda les dades a l'emmagatzematge local (localStorage) d'aquest navegador. Pots esborrar-les des de «Les meves simulacions» o eliminant les dades del lloc. No se sincronitzen amb cap servidor de Costalia. El tractament i conservació de registres tècnics depèn de la configuració de l'allotjament."]]},"en":{"title":"Privacy policy","intro":"How information is handled by the current Costalia version.","parts":[["Controller","TO BE COMPLETED: identity and contact details of the site operator/data controller."],["Calculator inputs","Figures and parameters are processed in the user's browser using JavaScript. The current application code does not transmit those values to a Costalia server. Clicking «Save simulation» stores the values locally in your browser; any optional budget entries are also calculated only in the browser. If you share a simulation, the values are embedded in the link you choose to copy; anyone receiving the link can view them."],["Hosting technical data","The hosting provider may process technical data, such as IP addresses and access logs, as necessary to deliver the site, subject to its infrastructure and policies. Verify the deployed configuration."],["Analytics, ads and forms","The current code does not include account forms, third-party analytics or advertising. Optional real-product search sends the search terms to a Costalia endpoint and then to SerpAPI to retrieve offers. Do not enter sensitive personal information in search. Technical logs may be produced by the hosting and search providers. If any are added, this notice must be updated before use."],["Rights and contact","Users may exercise applicable privacy rights by contacting the controller once the actual contact information is published. This notice is not final until the operator and hosting details are confirmed."],["Security and retention","When you choose «Save simulation», the app stores that simulation in this browser's localStorage. You can remove it from «My simulations» or clear the site's browser data. It is not synced to a Costalia server. Hosting log processing and retention may depend on the provider configuration."]]}};const common={"es":{"back":"Volver a la calculadora","footer":"Aviso legal · Privacidad · Cookies","warning":"Información legal en preparación: faltan los datos del titular."},"ca":{"back":"Torna a la calculadora","footer":"Avís legal · Privacitat · Cookies","warning":"Informació legal pendent: falten les dades del titular."},"en":{"back":"Back to calculator","footer":"Legal notice · Privacy · Cookies","warning":"Legal information pending: operator details must be completed."}};const select=document.getElementById("lang");let language=new URLSearchParams(location.search).get("lang");if(!["es","ca","en"].includes(language))language="es";select.value=language;
function render(){const x=texts[language],c=common[language];document.documentElement.lang=language;document.title=x.title+" | Costalia";document.getElementById("back").textContent="← "+c.back;document.getElementById("title").textContent=x.title;document.getElementById("intro").textContent=x.intro;document.getElementById("warning").textContent=c.warning;document.getElementById("sections").replaceChildren(...x.parts.map(([heading,desc])=>{const section=document.createElement("section");section.className="card";const h=document.createElement("h2");h.textContent=heading;const p=document.createElement("p");p.textContent=desc;section.append(h,p);return section;}));document.getElementById("legal").textContent=({es:"Aviso legal",ca:"Avís legal",en:"Legal notice"})[language];document.getElementById("privacy").textContent=({es:"Privacidad",ca:"Privacitat",en:"Privacy"})[language];document.querySelectorAll("footer a").forEach(a=>{const u=new URL(a.href);u.searchParams.set("lang",language);a.href=u.pathname+u.search;});document.getElementById("back").href="/?lang="+language;}
select.addEventListener("change",e=>{language=e.target.value;history.replaceState(null,"",location.pathname+"?lang="+language);render()});render();
</script></body></html>
